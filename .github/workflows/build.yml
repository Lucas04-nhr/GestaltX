name: Build IPA

# Builds an IPA with its entitlements embedded and publishes it as a release.
#
# This repository (the default):
# - Pushing a tag that starts with v, such as v1.1.0, builds that tag and
#   publishes it as a release under the same tag.
# - Pushing a tag that starts with sha-, such as sha-557369f, builds that tag and
#   publishes it as a beta pre-release.
# - Running the workflow by hand builds the branch it runs on and publishes it
#   as a beta pre-release tagged with its commit, such as sha-557369f.
# Rebuilding a tag replaces that release's IPA. The IPA name,
# GestaltX_<version>+<build>.ipa, carries the version and build number; the
# AltStore source skips pre-releases unless an app entry sets includePrereleases.
#
# source = upstream (by hand only): builds one upstream tag and publishes it
# under the same tag. The source is checked out from upstream at that tag, so
# the build matches the upstream version exactly. A tag that already has a
# release here is skipped unless forced. Push the upstream tag here first so
# the release points at upstream's commit. Push it with a token that starts no
# workflows, or the workflows inside the tag run here too.
#
# Every build gets a new CFBundleVersion: the project's CURRENT_PROJECT_VERSION
# plus the run number (e.g. 11100017 + 7), unless one is given. The version
# users see stays the marketing version. AltStore and SideStore
# offer an update when the build number changes, including when a tag is rebuilt.

on:
  push:
    tags: ["v*", "sha-*"]
  workflow_dispatch:
    inputs:
      source:
        description: What to build (this repository publishes a beta pre-release of the selected branch)
        type: choice
        options: [fork, upstream]
        default: fork
      tag:
        description: Upstream tag to build (upstream only; empty for the latest upstream release)
        type: string
        default: ""
      force:
        description: Rebuild even if this tag already has a release (upstream only)
        type: boolean
        default: false
      build_number:
        description: CFBundleVersion to use (empty for the project's build number plus this run's number). Must be higher than the last build.
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref_type == 'tag' && github.ref_name || inputs.source == 'upstream' && (inputs.tag || 'latest') || 'fork' }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: huamidev/GestaltX
  # Everything except a hand-started upstream build builds this repository
  FORK: ${{ github.event_name == 'push' || inputs.source != 'upstream' }}

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Fork builds list the commits since the previous tag in their notes
          fetch-depth: ${{ (github.event_name == 'push' || inputs.source != 'upstream') && '0' || '1' }}

      - name: Check release
        id: check
        if: env.FORK != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          tag="${INPUT_TAG:-$(gh release view --repo "$UPSTREAM_REPO" --json tagName --jq .tagName)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$FORCE" != "true" ]; then
              echo "Release $tag already exists; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream tag
        if: env.FORK != 'true' && steps.check.outputs.skip == 'false'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.check.outputs.tag }}
          path: upstream

      - name: Select Xcode
        if: env.FORK == 'true' || steps.check.outputs.skip == 'false'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build IPA
        id: build
        if: env.FORK == 'true' || steps.check.outputs.skip == 'false'
        env:
          SOURCE_DIR: ${{ env.FORK == 'true' && '.' || 'upstream' }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_INCREMENT: ${{ github.run_number }}
        run: .github/scripts/build-ipa.sh "$RUNNER_TEMP/ipa"

      - name: Publish fork build
        id: prerelease
        if: env.FORK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IPA: ${{ steps.build.outputs.ipa }}
          VERSION: ${{ steps.build.outputs.version }}
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          # A pushed v tag is a release; a pushed sha- tag or a run by hand is a beta pre-release
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="sha-${GITHUB_SHA:0:7}"; fi
          case "$tag" in
            v*) kind=release; title="$tag"; previous_match='v*'; prerelease=false
                if [ "$tag" != "v$VERSION" ]; then
                  echo "::warning title=Version mismatch::Tag $tag does not match the marketing version $VERSION"
                fi ;;
            *) kind=prerelease; title="v$VERSION beta ($BUILD)"; previous_match='*'; prerelease=true ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

          notes="$RUNNER_TEMP/notes.md"
          # Releases list the changes since the previous release; betas since the previous tag of any kind
          previous="$(git describe --tags --abbrev=0 --match "$previous_match" --exclude "$tag" 2>/dev/null || true)"
          label="Beta"; [ "$kind" = "release" ] && label="Release"
          {
            if [ -n "$previous" ]; then
              echo "Changes since ${previous}:"
              echo
              git log --no-merges --format='- %s (%h)' -n 50 "$previous..HEAD"
              echo
            fi
            echo "${label} built from ${GITHUB_REPOSITORY}@${GITHUB_REF_NAME} (${GITHUB_SHA:0:7}) by GitHub Actions as version ${VERSION}, build ${BUILD}. This IPA is ad-hoc signed with the entitlements of the app and its share extension, so SideStore and AltStore can register its App Group."
          } > "$notes"

          if gh release view "$tag" > /dev/null 2>&1; then
            # Rebuilding the same tag: replace the IPA, whose name carries the build number
            gh release view "$tag" --json assets --jq '.assets[].name' \
              | { grep -E '^GestaltX_.*\.ipa$' || true; } \
              | while IFS= read -r old; do
                  if [ "$old" != "$(basename "$IPA")" ]; then gh release delete-asset "$tag" "$old" --yes; fi
                done
            gh release upload "$tag" "$IPA" --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes" --prerelease="$prerelease"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$tag" "$IPA" --verify-tag --prerelease="$prerelease" --title "$title" --notes-file "$notes"
          else
            gh release create "$tag" "$IPA" --prerelease --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
          fi

      - name: Publish release
        id: publish
        if: env.FORK != 'true' && steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          EXISTS: ${{ steps.check.outputs.exists }}
          IPA: ${{ steps.build.outputs.ipa }}
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          source_sha="$(git -C upstream rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

          # Reuse upstream's notes for the tag, then say how this build differs
          notes="$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --repo "$UPSTREAM_REPO" --json body --jq .body > "$notes" 2>/dev/null || : > "$notes"
          if [ -s "$notes" ]; then
            printf '\n\n' >> "$notes"
          fi
          printf '%s\n' "Built from ${UPSTREAM_REPO}@${TAG} (${source_sha:0:7}) by GitHub Actions as build ${BUILD}. This IPA is ad-hoc signed with the entitlements of the app and its share extension, so SideStore and AltStore can register its App Group." >> "$notes"

          if [ "$EXISTS" = "true" ]; then
            # The build number is in the file name, so remove the previous IPA instead of
            # leaving two of them; the AltStore source uses the first matching asset.
            gh release view "$TAG" --json assets --jq '.assets[].name' \
              | { grep -E '^GestaltX_.*\.ipa$' || true; } \
              | while IFS= read -r old; do
                  if [ "$old" != "$(basename "$IPA")" ]; then gh release delete-asset "$TAG" "$old" --yes; fi
                done
            gh release upload "$TAG" "$IPA" --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            # A pushed upstream tag is used as is. A tag that is not here yet is created on the
            # default branch, so it does not point at upstream's commit.
            gh release create "$TAG" "$IPA" --title "$TAG" --notes-file "$notes"
          fi

      - name: Send ServerChan push
        # Push when a build was published or the run failed, not when it was skipped
        if: ${{ !cancelled() && (failure() || steps.publish.outcome == 'success' || steps.prerelease.outcome == 'success') }}
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          JOB_STATUS: ${{ job.status }}
          SOURCE: ${{ env.FORK == 'true' && 'fork' || 'upstream' }}
          KIND: ${{ steps.prerelease.outputs.kind }}
          TAG: ${{ steps.prerelease.outputs.tag || steps.check.outputs.tag }}
          EXISTS: ${{ steps.check.outputs.exists }}
          VERSION: ${{ steps.build.outputs.version }}
          BUILD: ${{ steps.build.outputs.build }}
          SOURCE_SHA: ${{ steps.prerelease.outputs.source_sha || steps.publish.outputs.source_sha }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUBLISH_OUTCOME: ${{ env.FORK == 'true' && steps.prerelease.outcome || steps.publish.outcome }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          tag="${TAG:-unknown tag}"
          if [ "$JOB_STATUS" = "success" ]; then
            export TITLE="GestaltX $VERSION ($BUILD) built"
            if [ "$KIND" = "release" ]; then
              export SHORT="$repo: Released $tag"
            elif [ "$SOURCE" = "fork" ]; then
              export SHORT="$repo: Pre-released $tag"
            elif [ "$EXISTS" = "true" ]; then
              export SHORT="$repo: Rebuilt $tag"
            else
              export SHORT="$repo: Released $tag"
            fi
          else
            export TITLE="GestaltX build failed"
            if [ "$BUILD_OUTCOME" = "failure" ]; then
              export SHORT="$repo: Could not build $tag"
            elif [ "$PUBLISH_OUTCOME" = "failure" ]; then
              export SHORT="$repo: Could not publish $tag"
            else
              export SHORT="$repo: The build workflow failed"
            fi
          fi
          export DESP="- Tag: \`$tag\`
          - Version: \`${VERSION:-unknown} (${BUILD:-unknown})\`
          - Source: \`$SOURCE\` @ \`${SOURCE_SHA:0:7}\`
          - Trigger: \`$GITHUB_EVENT_NAME\`
          - Build: \`${BUILD_OUTCOME:-skipped}\`
          - Publish: \`${PUBLISH_OUTCOME:-skipped}\`"
          if [ "$JOB_STATUS" = "success" ]; then
            DESP+=$'\n\n'"[View the release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag//+/%2B})"
          fi
          .github/scripts/serverchan.sh
